name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g., v1.2.3)'
        required: true
        type: string

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    
    steps:
      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          
          # Validate tag format
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Error: Invalid tag format. Expected: vX.Y.Z (e.g., v1.2.3)"
            exit 1
          fi
          
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "✅ Building version: $VERSION"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Create production .env
        run: |
          cat > .env.production << EOF
          # Production environment variables
          PLASMO_PUBLIC_API_URL=${{ secrets.PROD_API_URL }}
          PLASMO_PUBLIC_WEB_PORTAL_URL=${{ secrets.PROD_WEB_PORTAL_URL }}
          COMMENT_VERDICT_DEBUG=0
          PLASMO_PUBLIC_MAX_COMMENTS=100
          EOF

      - name: Build production extension
        run: pnpm run build:prod
        env:
          NODE_ENV: production

      - name: Create release package
        run: |
          cd build/chrome-mv3-prod
          zip -r ../../comment-verdict-chrome-extension-v${{ steps.tag.outputs.version }}.zip .
          cd ../..

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chrome-extension-v${{ steps.tag.outputs.version }}
          path: |
            build/chrome-mv3-prod/
            comment-verdict-chrome-extension-v${{ steps.tag.outputs.version }}.zip
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.version }}
          files: comment-verdict-chrome-extension-v${{ steps.tag.outputs.version }}.zip
          generate_release_notes: true
          draft: false
          prerelease: false
          body: |
            ## Chrome Extension Release v${{ steps.tag.outputs.version }}
            
            ### Installation
            1. Download `comment-verdict-chrome-extension-v${{ steps.tag.outputs.version }}.zip`
            2. Extract the ZIP file
            3. Go to `chrome://extensions/` in Chrome
            4. Enable "Developer mode"
            5. Click "Load unpacked" and select the extracted folder
            
            ### Publishing to Chrome Web Store
            
            **Automated Publishing:**
            Go to Actions → "Publish to Chrome Web Store" → Run workflow with version `${{ steps.tag.outputs.version }}`
            
            **Manual Upload:**
            Upload the ZIP file directly to the [Chrome Web Store Developer Dashboard](https://chrome.google.com/webstore/devconsole)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publishing Instructions
        run: |
          echo "## ✅ Release v${{ steps.tag.outputs.version }} Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Next Steps: Publish to Chrome Web Store" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Option 1: Automated Publishing**" >> $GITHUB_STEP_SUMMARY
          echo "1. Go to: Actions → 'Publish to Chrome Web Store'" >> $GITHUB_STEP_SUMMARY
          echo "2. Click 'Run workflow'" >> $GITHUB_STEP_SUMMARY
          echo "3. Enter version: ${{ steps.tag.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "4. Click 'Run workflow'" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Option 2: Manual Upload**" >> $GITHUB_STEP_SUMMARY
          echo "- Download: comment-verdict-chrome-extension-v${{ steps.tag.outputs.version }}.zip" >> $GITHUB_STEP_SUMMARY
          echo "- Upload to: https://chrome.google.com/webstore/devconsole" >> $GITHUB_STEP_SUMMARY
