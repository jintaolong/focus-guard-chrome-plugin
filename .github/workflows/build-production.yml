name: Production Release

on:
  push: "**" # Trigger on all pushes to any branch
  #   branches:
  #     - main
  # workflow_dispatch:
  #   inputs:
  #     skip-version-bump:
  #       description: 'Skip version bump (use current version)'
  #       required: false
  #       type: boolean
  #       default: false
  #     version-type:
  #       description: 'Version bump type (if not skipping)'
  #       required: false
  #       type: choice
  #       options:
  #         - auto
  #         - patch
  #         - minor
  #         - major
  #       default: auto

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: |
          if [ -f "package.json" ] && grep -q '"test"' package.json; then
            echo "Running tests..."
            pnpm test || echo "No tests found or tests failed, continuing..."
          else
            echo "No test script found, skipping tests"
          fi

  version-bump:
    name: Version Bump
    needs: test
    runs-on: ubuntu-latest
    if: github.event.inputs.skip-version-bump != 'true'
    outputs:
      new-version: ${{ steps.bump.outputs.new-version }}
      new-tag: ${{ steps.bump.outputs.new-tag }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine version bump type
        id: determine-bump
        run: |
          BUMP_TYPE="${{ github.event.inputs.version-type }}"
          
          if [ "$BUMP_TYPE" = "auto" ] || [ -z "$BUMP_TYPE" ]; then
            # Analyze commit messages since last tag
            LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            
            if [ -z "$LAST_TAG" ]; then
              echo "No previous tag found, defaulting to patch"
              BUMP_TYPE="patch"
            else
              # Get commits since last tag
              COMMITS=$(git log ${LAST_TAG}..HEAD --pretty=format:"%s")
              
              # Check for breaking changes or major features
              if echo "$COMMITS" | grep -qiE "^(feat|feature|breaking|major)(\(.+\))?!:"; then
                BUMP_TYPE="major"
              elif echo "$COMMITS" | grep -qiE "^(feat|feature)(\(.+\))?:"; then
                BUMP_TYPE="minor"
              else
                BUMP_TYPE="patch"
              fi
            fi
          fi
          
          echo "bump-type=$BUMP_TYPE" >> $GITHUB_OUTPUT
          echo "Determined bump type: $BUMP_TYPE"

      - name: Bump version
        id: bump
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "Current version: $CURRENT_VERSION"
          
          # Parse version
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
          
          BUMP_TYPE="${{ steps.determine-bump.outputs.bump-type }}"
          case $BUMP_TYPE in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac
          
          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          NEW_TAG="v$NEW_VERSION"
          
          echo "new-version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "new-tag=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION"
          
          # Update package.json
          npm version $NEW_VERSION --no-git-tag-version
          
          # Update manifest version if it exists
          if [ -f "package.json" ]; then
            # Plasmo will handle manifest version from package.json
            echo "Version updated in package.json"
          fi

      - name: Commit version bump
        run: |
          git add package.json package-lock.json 2>/dev/null || true
          git commit -m "chore: bump version to ${{ steps.bump.outputs.new-version }} [skip ci]" || echo "No changes to commit"
          git push origin main

      - name: Create and push tag
        run: |
          git tag ${{ steps.bump.outputs.new-tag }}
          git push origin ${{ steps.bump.outputs.new-tag }}

  build-and-release:
    name: Build and Release
    needs: [test, version-bump]
    runs-on: ubuntu-latest
    if: always() && needs.test.result == 'success'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version-bump.outputs.new-tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create production .env
        run: |
          cat > .env.production << EOF
          # Production environment variables
          PLASMO_PUBLIC_API_URL=https://commentverdict.com/api/v1
          PLASMO_PUBLIC_WEB_PORTAL_URL=https://app.commentverdict.com
          COMMENT_VERDICT_DEBUG=0
          EOF

      - name: Build production extension
        run: pnpm run build:prod
        env:
          NODE_ENV: production

      - name: Get version for artifact naming
        id: version
        run: |
          VERSION=${{ needs.version-bump.outputs.new-version }}
          if [ -z "$VERSION" ]; then
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Using version: $VERSION"

      - name: Create release package
        run: |
          cd build/chrome-mv3-prod
          zip -r ../../comment-verdict-chrome-extension-v${{ steps.version.outputs.version }}.zip .
          cd ../..

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chrome-extension-v${{ steps.version.outputs.version }}
          path: |
            build/chrome-mv3-prod/
            comment-verdict-chrome-extension-v${{ steps.version.outputs.version }}.zip
          retention-days: 90

      - name: Create GitHub Release
        if: needs.version-bump.outputs.new-tag != ''
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.version-bump.outputs.new-tag }}
          name: Release ${{ needs.version-bump.outputs.new-version }}
          files: comment-verdict-chrome-extension-v${{ steps.version.outputs.version }}.zip
          generate_release_notes: true
          draft: false
          prerelease: false
          body: |
            ## Chrome Extension Release v${{ steps.version.outputs.version }}
            
            ### Installation
            1. Download `comment-verdict-chrome-extension-v${{ steps.version.outputs.version }}.zip`
            2. Extract the ZIP file
            3. Go to `chrome://extensions/` in Chrome
            4. Enable "Developer mode"
            5. Click "Load unpacked" and select the extracted folder
            
            ### Publishing to Chrome Web Store
            
            **Option 1: Automated Publishing**
            Go to Actions → "Publish to Chrome Web Store" → Run workflow with version `${{ steps.version.outputs.version }}`
            
            **Option 2: Manual Upload**
            Upload the ZIP file directly to the [Chrome Web Store Developer Dashboard](https://chrome.google.com/webstore/devconsole)
            
            ---
            ${{ github.event.head_commit.message }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publishing Instructions
        if: needs.version-bump.outputs.new-tag != ''
        run: |
          echo "✅ Release v${{ steps.version.outputs.version }} created successfully!"
          echo ""
          echo "📦 To publish to Chrome Web Store:"
          echo "   1. Go to: Actions → 'Publish to Chrome Web Store'"
          echo "   2. Click 'Run workflow'"
          echo "   3. Enter version: ${{ steps.version.outputs.version }}"
          echo "   4. Click 'Run workflow'"
          echo ""
          echo "📋 Or download and upload manually:"
          echo "   Download: comment-verdict-chrome-extension-v${{ steps.version.outputs.version }}.zip"
          echo "   Upload to: https://chrome.google.com/webstore/devconsole"
